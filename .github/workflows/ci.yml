name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source, runtime and Storybook checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated theme, formatting, lint and types
        run: pnpm theme:check && pnpm format:check && pnpm lint && pnpm typecheck

      - name: Build library and run runtime tests
        run: pnpm build && node --test tests/*.test.mjs

      - name: Build Storybook
        run: pnpm build:storybook

  consumers:
    name: Installed package, styles and compositions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Check installed package, production styles and compositions
        run: pnpm test:package --styles --compositions

      - name: Save installed consumer results and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-consumer-results
          path: output/browser/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser interactions and accessibility (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Check Storybook interactions, accessibility and browser platform
        run: pnpm test:browser --shard=${{ matrix.shard }}/4

      - name: Save browser results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-results-${{ matrix.shard }}
          path: output/browser/
          if-no-files-found: ignore
          retention-days: 14

  check:
    name: Library checks
    if: ${{ always() }}
    needs: [quality, consumers, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const results = JSON.parse(process.env.JOB_RESULTS)
            for (const [job, { result }] of Object.entries(results)) {
              console.log(`${job}: ${result}`)
              if (result !== "success") process.exitCode = 1
            }
          '
