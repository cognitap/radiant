name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Reevaluate Visual matrix when the visual-baselines label starts or ends a refresh.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Library checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source, library build and the packed package
        run: pnpm check:library

  storybook:
    name: Storybook checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Check the Storybook build and Radiant light and dark
        run: pnpm check:storybook

      - name: Save browser results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-results
          path: output/browser/
          if-no-files-found: ignore
          retention-days: 14

  behavior:
    name: Browser behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Check keyboard, forms, motion and hydration
        run: pnpm test:browser --project=browser-platform

      - name: Save behavior results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-behavior
          path: output/browser/
          if-no-files-found: ignore
          retention-days: 14

  conformance:
    name: A2UI conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Check every A2UI fixture in every other theme and mode
        run: pnpm check:conformance

      - name: Save conformance results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: a2ui-conformance
          path: output/browser/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual matrix
    # While a pull request carries the visual-baselines label its images are being re-rendered, so
    # comparing against the old ones would only fail. Remove the label after committing them.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'visual-baselines') }}
    # Baselines are only valid for the image that rendered them; bump with a baseline refresh.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install headless Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Require Linux baselines
        run: |
          if ! compgen -G 'tests/visual/__screenshots__/*/*-linux.png' > /dev/null; then
            echo '::error::No Linux visual baselines. Run the Visual baselines workflow on this branch and commit its artifact (CONTRIBUTING.md, Visual matrix).'
            exit 1
          fi

      - name: Compare every catalog combination with its approved screenshot
        run: pnpm test:visual

      - name: Explain how to approve changes
        if: ${{ failure() }}
        run: |
          {
            echo '### Visual matrix failed'
            echo 'Download the `visual-diffs` artifact to see each reference, actual and diff image.'
            echo 'If the changes are intended, run the Visual baselines workflow on this branch and commit its artifact (CONTRIBUTING.md, Visual matrix).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save visual results and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-diffs
          path: output/browser/
          if-no-files-found: ignore
          retention-days: 14
