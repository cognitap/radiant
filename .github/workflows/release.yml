name: Release Radiant

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified archive with npm trusted publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: radiant-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:prepare
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}

      - uses: actions/upload-artifact@v7.0.2
        id: candidate
        with:
          name: radiant-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish && github.repository == 'cognitap/radiant' && github.ref == 'refs/heads/main' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: dist/release/

      - name: Publish the prepared archive with trusted publishing
        run: pnpm publish dist/release/radiant.tgz --no-git-checks --ignore-scripts --access public --tag latest --registry https://registry.npmjs.org/ --publish-wait-timeout 300000

      - name: Confirm registry integrity
        run: |
          version=$(jq -r .version dist/release/release.json)
          published=$(pnpm view "@cognitap/radiant@$version" dist.integrity --registry https://registry.npmjs.org/ --json | jq -r .)
          expected=$(jq -r .integrity dist/release/release.json)
          if [ "$published" != "$expected" ]; then
            printf 'published %s\nexpected  %s\n' "$published" "$expected"
            exit 1
          fi
