<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>Radiant spring engine proof</title>
    <link
      rel="stylesheet"
      href="radiant.css"
    />
    <style>
      body {
        margin: 0;
        background: #f3f2ef;
        color: #222;
        font: 16px/1.5 system-ui;
      }
      main {
        max-width: 1000px;
        margin: auto;
        padding: 24px;
        display: grid;
        gap: 18px;
      }
      h1,
      h2,
      p {
        margin: 0 0 12px;
      }
      section {
        background: white;
        padding: 24px;
        border: 1px solid #ccc;
        border-radius: 12px;
        min-width: 0;
      }
      label {
        display: inline-flex;
        gap: 8px;
        margin: 10px;
      }
      output {
        display: block;
        margin: 10px 0;
      }
      button {
        margin: 4px;
      }
      .inside {
        padding: 16px;
      }
      .spring-details::details-content {
        height: auto !important;
        content-visibility: visible;
        transition: none !important;
      }
      .track,
      .follow-track {
        height: 100px;
        background: #eee;
        display: flex;
        align-items: center;
        border-radius: 8px;
        overflow: clip;
      }
      .track {
        justify-content: center;
      }
      .follow-track {
        position: relative;
      }
      .dot {
        display: block;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #6941c6;
      }
      .layout-surface {
        max-width: 100%;
        padding: 12px;
        background: #eee;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .layout-surface ol {
        padding: 0;
        list-style: none;
      }
      .layout-surface li {
        margin: 8px 0;
        background: #ddd;
        border-radius: 6px;
        padding: 8px;
      }
      dialog {
        max-width: min(480px, 90vw);
      }
      main[data-motion='off'] * {
        transition: none !important;
      }
      @media (max-width: 400px) {
        main {
          padding: 12px;
        }
        section {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="app.js"
    ></script>
  </body>
</html>
